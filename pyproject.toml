[project]
name = "code-search-mcp"
version = "0.2.0"
description = "Local semantic code search MCP server (EmbeddingGemma 2) for Codex, Claude Code and Claude Desktop"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp>=1.2",
    "numpy>=1.24",
    "sentence-transformers>=5.0",
    "transformers",
    "torch",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.7",
    "watchdog>=4.0",
    "pillow",
]

[project.optional-dependencies]
finetune = ["datasets", "accelerate", "peft"]
dev = ["pytest"]

[project.scripts]
code-search = "code_search.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
