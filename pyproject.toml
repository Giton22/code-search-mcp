[project]
name = "code-search-mcp"
version = "0.2.0"
description = "Local semantic code search MCP server (EmbeddingGemma 2) for Codex, Claude Code and Claude Desktop"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp>=1.2",
    "numpy>=1.24",
    "sentence-transformers>=5.0",
    "transformers",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.7",
    "watchdog>=4.0",
    "pillow",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
code-search = "code_search.cli:main"

[tool.uv]
# PyTorch (and torchvision, which EmbeddingGemma 2's processor needs) is installed by
# `code-search setup` for this machine's GPU: CUDA, ROCm, MPS or CPU. Keeping it out of the
# lockfile means `uv run` never swaps that build for a CPU one.
exclude-dependencies = ["torch", "torchvision"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
